# Brandhof · Netlify-Konfiguration
[build]
  publish = "."
  command = ""
  functions = "netlify/functions"

# PDFs und karten.json: immer frisch prüfen, damit neue Karten sofort sichtbar sind
[[headers]]
  for = "/karten/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Bilder (WebP) lange cachen
[[headers]]
  for = "/bilder/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Alte Adressen der LearnConsult-Seite auf die neuen Seiten umleiten
[[redirects]]
  from = "/downloads/TAGESKARTE.pdf"
  to = "/karten/tageskarte.pdf"
  status = 301

